name: Session lifecycle

# Calls /api/cron/session-lifecycle so 55-minute warnings and 60-minute completions are recorded
# even when nobody has Zuryo open. GitHub runs schedules at most every 5 minutes and may start them
# late; the route is idempotent and always records completion at the persisted deadline, so a late
# or doubled run never changes the outcome.
#
# Setup: add the repository secret CRON_SECRET (same value as the Vercel production env var).
# Optional repository variable APP_URL overrides the deployment URL.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: session-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconcile due sessions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://zuryo-fit.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/session-lifecycle"
